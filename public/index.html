<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Nadège Renard — scénographe et peintre. Scénographie, spectacles, transmission, patines et couleurs.">
  <title>Nadège Renard — scénographe / peintre</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/site.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="/" id="site-brand" class="site-brand" data-link>Nadège Renard</a>
    <button id="menu-button" class="menu-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav id="site-menu" class="site-menu" aria-label="Navigation principale" hidden>
    <div class="menu-panel"><button class="menu-close" id="menu-close" aria-label="Fermer le menu">×</button>
      <div id="menu-links" class="menu-links"></div>
    </div>
  </nav>
  <main id="app" class="app" tabindex="-1"><div class="loading">Chargement…</div></main>
  <footer class="site-footer">
    <div class="footer-main">
      <a href="/contact" data-link>CONTACT</a>
      <div id="social-links" class="social-links"></div>

    <div class="footer-bottom">
      <span id="copyright">© Nadège Renard</span>
      <button type="button" id="legal-button" class="footer-link">Mentions légales</button>

      <a class="footer-link footer-admin" href="/administration/">Administration</a>
    </div>
  </footer>
  <dialog id="legal-dialog" class="legal-dialog" aria-label="Mentions légales">

  </dialog>

    <h2>CONFIDENTIALITÉ</h2><div id="privacy-text" class="legal-text"></div>
  </dialog>

</html>
